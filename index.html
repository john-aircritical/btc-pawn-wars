<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAWN WARS · BTC — every trade is a battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#07080c; --panel:rgba(10,12,18,.78);
    --gold:#e8b64c; --gold-hot:#ffd97a; --crimson:#e0364f; --crimson-hot:#ff6b7d;
    --bone:#cfd4dd; --dim:#6a7280; --line:rgba(232,182,76,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:'IBM Plex Mono',monospace;color:var(--bone);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}

  .hud{position:fixed;z-index:10;pointer-events:none}
  #topbar{top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:14px 20px;
    background:linear-gradient(to bottom, rgba(7,8,12,.92), rgba(7,8,12,0))}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:'Cinzel',serif;font-weight:900;font-size:22px;letter-spacing:.14em;color:var(--gold);
    text-shadow:0 0 24px rgba(232,182,76,.45)}
  .brand h1 .vs{color:var(--crimson);text-shadow:0 0 24px rgba(224,54,79,.5)}
  .brand .sub{font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  #price{font-size:26px;font-weight:700;color:#fff;letter-spacing:.02em;min-width:180px;text-align:right;
    transition:color .15s}
  #price.up{color:var(--gold-hot)} #price.down{color:var(--crimson-hot)}
  #delta{font-size:12px;padding:3px 9px;border-radius:3px;font-weight:600}
  #delta.up{color:#0a0a0a;background:var(--gold)} #delta.down{color:#fff;background:var(--crimson)}
  #conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;color:var(--dim)}
  #conn .dot{width:8px;height:8px;border-radius:50%;background:#3fbf6f;box-shadow:0 0 10px #3fbf6f;animation:pulse 1.6s infinite}
  #conn.sim .dot{background:#c9a227;box-shadow:0 0 10px #c9a227}
  #conn.dead .dot{background:#555;box-shadow:none;animation:none}
  @keyframes pulse{50%{opacity:.35}}

  #tide{position:fixed;top:58px;left:50%;transform:translateX(-50%);width:min(520px,70vw);z-index:10;pointer-events:none}
  #tide .lbl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.25em;color:var(--dim);margin-bottom:4px}
  #tide .lbl b:first-child{color:var(--gold)} #tide .lbl b:last-child{color:var(--crimson)}
  #tidebar{height:5px;border-radius:3px;overflow:hidden;background:var(--crimson);box-shadow:0 0 14px rgba(224,54,79,.35)}
  #tidefill{height:100%;width:50%;background:linear-gradient(90deg,var(--gold),var(--gold-hot));
    box-shadow:0 0 14px rgba(232,182,76,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}

  #killfeed{left:16px;top:120px;width:290px;display:flex;flex-direction:column;gap:6px}
  #killfeed .k{background:var(--panel);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 4px 4px 0;
    font-size:11px;line-height:1.45;backdrop-filter:blur(6px);animation:kin .35s cubic-bezier(.2,.9,.3,1.2)}
  #killfeed .k.bear{border-left-color:var(--crimson)}
  #killfeed .k .rank{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.12em}
  #killfeed .k.bull .rank{color:var(--gold-hot)} #killfeed .k.bear .rank{color:var(--crimson-hot)}
  #killfeed .k .amt{color:#fff;font-weight:600}
  #killfeed .k .at{color:var(--dim)}
  @keyframes kin{from{opacity:0;transform:translateX(-18px)}}

  #legend{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
    background:var(--panel);padding:8px 18px;border-radius:6px;border:1px solid var(--line);backdrop-filter:blur(6px)}
  #legend .p{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
  #legend .p .g{font-size:16px;color:var(--bone)}
  #legend .sep{width:1px;height:18px;background:var(--line)}

  #hint{bottom:64px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;text-align:center;transition:opacity 1s}
  #hint.gone{opacity:0}

  #snapback{position:fixed;right:18px;bottom:18px;z-index:20;font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.15em;font-size:11px;color:#0a0a0a;background:var(--gold);border:none;padding:9px 16px;
    border-radius:4px;cursor:pointer;display:none;box-shadow:0 0 20px rgba(232,182,76,.5)}
  #snapback:hover{background:var(--gold-hot)}
  #battlebtn{position:fixed;right:18px;top:70px;z-index:20;font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.12em;font-size:11px;color:var(--gold);background:var(--panel);border:1px solid var(--line);
    padding:9px 14px;border-radius:4px;cursor:pointer;backdrop-filter:blur(6px)}
  #battlebtn:hover{color:var(--gold-hot);border-color:var(--gold)}
  @media (max-width:760px){ #killfeed{display:none} .brand .sub{display:none} #tide{top:66px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="topbar">
  <div class="brand">
    <h1>PAWN <span class="vs">WARS</span></h1>
    <span class="sub">BTC / USDT · every trade is a battle</span>
  </div>
  <div id="price">—</div><div id="delta" class="up">·</div>
  <div id="conn" class="dead"><span class="dot"></span><span id="connlbl">CONNECTING</span></div>
</div>

<div id="tide"><div class="lbl"><b>⚔ BULL LEGION</b><b>BEAR HORDE ⚔</b></div>
  <div id="tidebar"><div id="tidefill"></div></div></div>

<div class="hud" id="killfeed"></div>

<div class="hud" id="legend">
  <div class="p"><span class="g">♟</span>PAWN &lt;$10K</div>
  <div class="p"><span class="g">♞</span>KNIGHT $10K</div>
  <div class="p"><span class="g">♝</span>BISHOP $50K</div>
  <div class="sep"></div>
  <div class="p"><span class="g">♜</span>ROOK $250K</div>
  <div class="p"><span class="g">♛</span>QUEEN $1M</div>
  <div class="p"><span class="g">♚</span>KING $5M+</div>
</div>
<div class="hud" id="hint">scroll to zoom · drag to pan · click a candle to enter the battle</div>
<button id="snapback">⏵ RETURN TO FRONT</button>
<button id="battlebtn">⚔ ENTER BATTLE</button>

<script>
'use strict';
/* ============ CONFIG ============ */
const RANKS = [
  {name:'PAWN',   g:'♟︎', min:0,       sz:.72},
  {name:'KNIGHT', g:'♞︎', min:1e4,     sz:.86},
  {name:'BISHOP', g:'♝︎', min:5e4,     sz:.95},
  {name:'ROOK',   g:'♜︎', min:2.5e5,   sz:1.05},
  {name:'QUEEN',  g:'♛︎', min:1e6,     sz:1.22},
  {name:'KING',   g:'♚︎', min:5e6,     sz:1.38},
];
const rankOf = usd => { let r=0; for(let i=0;i<RANKS.length;i++) if(usd>=RANKS[i].min) r=i; return r; };
const GOLD='#e8b64c', GOLD_HOT='#ffd97a', CRIM='#e0364f', CRIM_HOT='#ff6b7d';
const KILL_MIN = 1e5;          // killfeed threshold
const MAX_CANDLES = 520;

/* ============ STATE ============ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
const candles = [];            // {t,o,h,l,c,bull,bear, armyB:[],armyR:[], live}
const cam = { i:0, ppc:7, ti:0, tppc:7, follow:true };
const floats = [];             // floating text / shockwaves
const sparks = [];             // battle particles
const embers = [];             // ambient
let yLo=0, yHi=1, tyLo=0, tyHi=1, shake=0, lastPrice=0, priceDir=0;
let mode='dead';               // live | sim | dead
let t0 = performance.now();

/* ============ UTILS ============ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtUsd = v => v>=1e6? '$'+(v/1e6).toFixed(2)+'M' : v>=1e3? '$'+(v/1e3).toFixed(0)+'K' : '$'+v.toFixed(0);
const fmtP = p => p>=1000 ? p.toLocaleString('en-US',{maximumFractionDigits:0}) : p.toFixed(2);

/* ============ ARMY SYNTH (historical candles: decompose $ volume into pieces) ============ */
function synthArmy(usd, seed){
  const rnd = mulberry32(seed), army=[];
  const caps=[1,2,3,5,8,14]; // king..pawn max counts
  const vals=[5e6,1e6,2.5e5,5e4,1e4,1500];
  let rem=usd;
  for(let i=0;i<vals.length;i++){
    const ri=5-i;
    let n=Math.min(caps[i], Math.floor(rem/vals[i]*(0.6+rnd()*0.5)));
    if(ri>=4 && rnd()<0.5) n=Math.min(n,1);       // royalty is rare
    for(let k=0;k<n;k++) army.push({r:ri, ph:rnd()*6.28, fx:rnd(), sp:.6+rnd()*.9});
    rem-=n*vals[i];
  }
  if(!army.length) army.push({r:0,ph:rnd()*6.28,fx:rnd(),sp:1});
  army.sort((a,b)=>a.r-b.r);
  return army.slice(0,32);
}
function finalizeCandle(c){
  c.armyB = synthArmy(c.bull, (c.t/60000)|0);
  c.armyR = synthArmy(c.bear, ((c.t/60000)|0)^0x9e37);
}

/* ============ DATA: Binance vision → Binance → Coinbase → SIM ============ */
function setConn(m,lbl){ mode=m;
  const el=document.getElementById('conn');
  el.className=m==='live'?'':(m==='sim'?'sim':'dead');
  document.getElementById('connlbl').textContent=lbl;
}
async function loadKlines(){
  for(const base of ['https://data-api.binance.vision','https://api.binance.com']){
    try{
      const r=await fetch(base+'/api/v3/klines?symbol=BTCUSDT&interval=1m&limit='+MAX_CANDLES,{signal:AbortSignal.timeout(7000)});
      if(!r.ok) throw 0;
      const j=await r.json();
      for(const k of j){
        const q=+k[7], bq=+k[10];
        const c={t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],bull:bq,bear:Math.max(q-bq,0),live:false};
        finalizeCandle(c); candles.push(c);
      }
      return 'binance';
    }catch(e){}
  }
  try{ // Coinbase (no taker split → seeded ~50/50 lean by direction)
    const r=await fetch('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60',{signal:AbortSignal.timeout(7000)});
    if(!r.ok) throw 0;
    const j=(await r.json()).reverse();
    for(const k of j){
      const [t,l,h,o,c,v]=k, q=v*c, up=c>=o, rnd=mulberry32(t|0)();
      const share=up? .53+rnd*.12 : .35+rnd*.12;
      const cd={t:t*1000,o,h,l,c,bull:q*share,bear:q*(1-share),live:false};
      finalizeCandle(cd); candles.push(cd);
    }
    return 'coinbase';
  }catch(e){}
  return null;
}
function onTrade(price,usd,isBull,ts){
  lastPrice&&(priceDir=price>lastPrice?1:price<lastPrice?-1:priceDir); lastPrice=price;
  let c=candles[candles.length-1];
  const bucket=Math.floor(ts/60000)*60000;
  if(!c || bucket>c.t){
    c={t:bucket,o:price,h:price,l:price,c:price,bull:0,bear:0,live:true,armyB:[],armyR:[]};
    candles.push(c);
    if(candles.length>MAX_CANDLES){candles.shift(); cam.ti--; cam.i--;}
    const prev=candles[candles.length-2];
    if(prev){prev.live=false; finalizeCandle(prev);}
  }
  c.h=Math.max(c.h,price); c.l=Math.min(c.l,price); c.c=price;
  if(isBull)c.bull+=usd; else c.bear+=usd;
  const r=rankOf(usd);
  // live army grows with real trades (knight+ join the field)
  if(r>=1){
    const arm=isBull?c.armyB:c.armyR, rnd=Math.random;
    arm.push({r,ph:rnd()*6.28,fx:rnd(),sp:.6+rnd()*.9,born:performance.now()});
    arm.sort((a,b)=>a.r-b.r); if(arm.length>32)arm.splice(0, arm.length-32);
  }
  if(r>=3){ // rook+: battlefield shockwave event
    floats.push({ci:candles.length-1,p:price,g:RANKS[r].g,txt:fmtUsd(usd),bull:isBull,t:performance.now(),big:r>=4});
    if(r>=5) shake=Math.min(shake+9,14);
    else if(r>=4) shake=Math.min(shake+4,10);
  }
  if(usd>=KILL_MIN) killfeed(r,usd,price,isBull);
  updateHUD();
}
function connectWS(){
  const hosts=['wss://data-stream.binance.vision/ws/btcusdt@aggTrade','wss://stream.binance.com:9443/ws/btcusdt@aggTrade'];
  let hi=0, cbTried=false;
  function tryBinance(){
    if(hi>=hosts.length) return tryCoinbase();
    const ws=new WebSocket(hosts[hi++]);
    let ok=false;
    const bail=setTimeout(()=>{if(!ok){try{ws.close()}catch(e){}}},6000);
    ws.onmessage=ev=>{ ok=true; clearTimeout(bail); setConn('live','LIVE · BINANCE');
      const d=JSON.parse(ev.data), p=+d.p, q=+d.q;
      onTrade(p,p*q,!d.m,d.T); };
    ws.onclose=()=>{ clearTimeout(bail); if(ok){setConn('dead','RECONNECTING');setTimeout(connectWS,2000);} else tryBinance(); };
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  function tryCoinbase(){
    if(cbTried) return startSim(); cbTried=true;
    const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');
    let ok=false;
    const bail=setTimeout(()=>{if(!ok){try{ws.close()}catch(e){}}},7000);
    ws.onopen=()=>ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD'],channels:['matches']}));
    ws.onmessage=ev=>{const d=JSON.parse(ev.data);
      if(d.type!=='match'&&d.type!=='last_match')return;
      ok=true; clearTimeout(bail); setConn('live','LIVE · COINBASE');
      const p=+d.price, q=+d.size;
      onTrade(p,p*q,d.side==='sell',Date.parse(d.time)); };
    ws.onclose=()=>{ clearTimeout(bail); if(ok){setConn('dead','RECONNECTING');setTimeout(connectWS,2000);} else startSim(); };
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  tryBinance();
}
let simOn=false;
function startSim(){ // last resort: the war never stops
  if(simOn)return; simOn=true; setConn('sim','SIMULATION');
  let p=lastPrice||candles[candles.length-1]?.c||65000, drift=0;
  setInterval(()=>{
    drift=drift*.94+(Math.random()-.5)*14;
    p=Math.max(1000,p+drift+(Math.random()-.5)*20);
    const big=Math.random(), usd=big>.997?(2e6+Math.random()*8e6):big>.97?(2e5+Math.random()*9e5):(800+Math.random()**2*6e4);
    onTrade(p,usd,Math.random()<.5+drift*.004,Date.now());
  },140);
}

/* ============ KILLFEED ============ */
const kfEl=document.getElementById('killfeed');
function killfeed(r,usd,price,isBull){
  const d=document.createElement('div');
  d.className='k '+(isBull?'bull':'bear');
  d.innerHTML=`<span class="rank">${RANKS[r].g} ${isBull?'BULL':'BEAR'} ${RANKS[r].name}</span><br>
    <span class="amt">${fmtUsd(usd)}</span> <span class="at">strike @ ${fmtP(price)}</span>`;
  kfEl.prepend(d);
  while(kfEl.children.length>7) kfEl.lastChild.remove();
  setTimeout(()=>{d.style.transition='opacity 1s';d.style.opacity='0';setTimeout(()=>d.remove(),1000)},14000);
}

/* ============ HUD ============ */
const priceEl=document.getElementById('price'), deltaEl=document.getElementById('delta'), tideEl=document.getElementById('tidefill');
let hudTick=0;
function updateHUD(){
  if(performance.now()-hudTick<150)return; hudTick=performance.now();
  const c=candles[candles.length-1]; if(!c)return;
  priceEl.textContent=fmtP(c.c);
  priceEl.className=priceDir>0?'up':priceDir<0?'down':'';
  const ref=candles[Math.max(0,candles.length-61)];
  const pct=(c.c/ref.o-1)*100;
  deltaEl.textContent=(pct>=0?'▲ +':'▼ ')+pct.toFixed(2)+'% / 1H';
  deltaEl.className=pct>=0?'up':'down';
}
function updateTide(i0,i1){
  let b=0,s=0;
  for(let i=Math.max(0,i0);i<=Math.min(candles.length-1,i1);i++){b+=candles[i].bull;s+=candles[i].bear;}
  if(b+s>0) tideEl.style.width=(b/(b+s)*100).toFixed(1)+'%';
}

/* ============ CAMERA & INPUT ============ */
const xOf=i=>(i-cam.i)*cam.ppc+W/2;
const iAt=x=>(x-W/2)/cam.ppc+cam.i;
const yOf=p=>H-((p-yLo)/(yHi-yLo))*(H*0.72)-H*0.16;
function fitY(){
  const half=W/(2*cam.ppc);
  let lo=Infinity,hi=-Infinity;
  for(let i=Math.max(0,Math.floor(cam.i-half));i<=Math.min(candles.length-1,Math.ceil(cam.i+half));i++){
    const c=candles[i]; if(c.l<lo)lo=c.l; if(c.h>hi)hi=c.h;
  }
  if(lo===Infinity)return;
  const pad=(hi-lo)*0.10+1;
  tyLo=lo-pad; tyHi=hi+pad;
}
let dragging=false,dragMoved=0,px0=0;
cv.addEventListener('pointerdown',e=>{dragging=true;dragMoved=0;px0=e.clientX;cv.classList.add('dragging');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{ if(!dragging)return;
  const dx=e.clientX-px0; px0=e.clientX; dragMoved+=Math.abs(dx);
  cam.ti-=dx/cam.ppc; cam.i=cam.ti; cam.follow=false; snap.style.display='block';
});
cv.addEventListener('pointerup',e=>{ dragging=false; cv.classList.remove('dragging');
  if(dragMoved<5){ // click → enter battle on that candle
    const i=Math.round(iAt(e.clientX));
    if(i>=0&&i<candles.length){
      if(cam.tppc<150){ cam.ti=i; cam.tppc=230; cam.follow=false; snap.style.display='block'; }
      else { cam.tppc=8; }
      hint();
    }
  }
});
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const iP=iAt(e.clientX);
  cam.tppc=clamp(cam.tppc*Math.exp(-e.deltaY*0.0016),1.2,420);
  // keep candle under cursor pinned
  cam.ti=iP-(e.clientX-W/2)/cam.tppc;
  if(Math.abs(cam.ti-(candles.length-1))<2 && cam.tppc<20){cam.follow=true;snap.style.display='none';}
  else {cam.follow=false;snap.style.display='block';}
  hint();
},{passive:false});
cv.addEventListener('dblclick',()=>{cam.tppc=7;});
window.addEventListener('keydown',e=>{if(e.key==='Escape'){cam.tppc=7;cam.follow=true;snap.style.display='none';}});
const snap=document.getElementById('snapback');
snap.onclick=()=>{cam.follow=true;cam.tppc=Math.min(cam.tppc,9);snap.style.display='none';};
document.getElementById('battlebtn').onclick=()=>{
  cam.follow=false; cam.ti=candles.length-1; cam.tppc=230; snap.style.display='block'; hint();
};
let hinted=false;
function hint(){ if(!hinted){hinted=true;document.getElementById('hint').classList.add('gone');} }

/* ============ RENDER ============ */
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();
for(let i=0;i<70;i++) embers.push({x:Math.random(),y:Math.random(),v:.008+Math.random()*.03,s:Math.random()*1.6+.4,g:Math.random()<.55});

function drawBackground(t){
  const g=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H*0.42,Math.max(W,H)*0.75);
  g.addColorStop(0,'#0c0e15'); g.addColorStop(.6,'#07080c'); g.addColorStop(1,'#040407');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // war-map grid
  ctx.strokeStyle='rgba(180,190,220,0.045)'; ctx.lineWidth=1; ctx.beginPath();
  const range=yHi-yLo, step=Math.pow(10,Math.floor(Math.log10(range/4)));
  const inc = range/step>8? step*2.5 : step;
  ctx.fillStyle='rgba(140,150,170,.4)'; ctx.font='10px IBM Plex Mono'; ctx.textAlign='right';
  for(let p=Math.ceil(yLo/inc)*inc;p<yHi;p+=inc){
    const y=yOf(p); ctx.moveTo(0,y); ctx.lineTo(W,y);
    ctx.fillText(fmtP(p),W-8,y-4);
  }
  ctx.stroke();
  // embers
  for(const e of embers){
    e.y-=e.v/60; if(e.y<0){e.y=1;e.x=Math.random();}
    const ex=e.x*W+Math.sin(t*.0004+e.x*40)*30, ey=e.y*H;
    ctx.fillStyle=e.g?'rgba(232,182,76,.28)':'rgba(224,54,79,.22)';
    ctx.fillRect(ex,ey,e.s,e.s);
  }
}

function drawPiece(x,y,rank,bull,fontPx,alpha,glow,fallen){
  const R=RANKS[rank];
  ctx.save(); ctx.translate(x,y);
  if(fallen){ctx.rotate(bull?-1.35:1.35);ctx.globalAlpha=alpha*.4;}
  else ctx.globalAlpha=alpha;
  ctx.font=(fontPx*R.sz)+'px "Noto Sans Symbols2","Segoe UI Symbol",serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(glow){ctx.shadowColor=bull?GOLD:CRIM;ctx.shadowBlur=fontPx*.55;}
  ctx.fillStyle=fallen?'#5a5f6b':(bull?(rank>=4?GOLD_HOT:GOLD):(rank>=4?CRIM_HOT:CRIM));
  ctx.fillText(R.g,0,0);
  ctx.restore();
}

function drawArmies(c,i,t,cx,alpha){
  const wSlot=cam.ppc*0.84;
  const yH=yOf(c.h), yL=yOf(c.l);
  const zoneH=Math.max(yL-yH,40);
  const yF=clamp(yOf(c.c), yH+zoneH*0.16, yL-zoneH*0.16); // each side keeps a foothold
  const fontPx=clamp(cam.ppc*0.13,11,42);
  // battlefield zone
  ctx.globalAlpha=alpha*.55;
  const zone=ctx.createLinearGradient(0,yH,0,yL);
  zone.addColorStop(0,'rgba(224,54,79,.10)');
  zone.addColorStop(clamp((yF-yH)/Math.max(yL-yH,1),0,1),'rgba(255,255,255,.03)');
  zone.addColorStop(1,'rgba(232,182,76,.10)');
  ctx.fillStyle=zone; ctx.fillRect(cx-wSlot/2,yH,wSlot,yL-yH);
  ctx.strokeStyle='rgba(207,212,221,.12)'; ctx.strokeRect(cx-wSlot/2,yH,wSlot,yL-yH);
  // front line
  ctx.globalAlpha=alpha;
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([5,4]); ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(cx-wSlot/2,yF);ctx.lineTo(cx+wSlot/2,yF);ctx.stroke();ctx.setLineDash([]);
  const up=c.c>=c.o, mag=Math.abs(c.c-c.o)/Math.max(c.h-c.l,1e-9);
  const place=(army,bull)=>{
    const y0=bull?yF:yH, y1=bull?yL:yF;                 // bulls hold low ground, push up
    const depth=Math.max(Math.abs(y1-y0),20);
    const cols=Math.max(2,Math.floor(wSlot/(fontPx*1.05)));
    const rows=Math.max(1,Math.ceil(army.length/cols));
    const rowH=clamp(depth/(rows+1), fontPx*0.9, fontPx*2.3); // spread to hold territory
    const losing=bull!==up, casualties=losing?Math.floor(army.length*mag*.5):0;
    for(let k=0;k<army.length;k++){
      const u=army[k], col=k%cols, row=(k/cols)|0;
      const bx=cx-wSlot/2+(col+0.5)*wSlot/cols+(u.fx-.5)*fontPx*.5;
      const dir=bull?1:-1;
      let by=yF+dir*(row+0.75)*rowH;
      // animation: bob + front-row lunges at the line
      const lunge=(row===0)?Math.max(0,Math.sin(t*.0016*u.sp+u.ph))*rowH*.55:0;
      by+= Math.sin(t*.002*u.sp+u.ph)*2 - dir*lunge;
      let a=alpha;
      if(u.born){const age=t-u.born; a*=clamp(age/400,0,1); if(age<600) by-=dir*(1-age/600)*30;}
      const fallen=k<casualties;
      drawPiece(bx,fallen?yF+dir*rowH*.35:by,u.r,bull,fontPx,a,cam.ppc>140&&u.r>=3,fallen);
      // sparks where front row meets the line
      if(row===0&&!fallen&&lunge>rowH*.5&&Math.random()<.25&&sparks.length<260)
        sparks.push({x:bx,y:yF,vx:(Math.random()-.5)*1.6,vy:-Math.random()*1.4,l:1,g:bull});
    }
  };
  place(c.armyB,true); place(c.armyR,false);
  // banner: victor crest above the field
  if(cam.ppc>150){
    ctx.globalAlpha=alpha*.9;
    ctx.font='700 '+clamp(cam.ppc*.05,10,14)+'px Cinzel';
    ctx.textAlign='center';
    ctx.fillStyle=up?GOLD:CRIM;
    ctx.fillText(up?'⚑ BULLS ADVANCE':'⚑ BEARS ADVANCE',cx,yH-14);
    ctx.font='10px IBM Plex Mono'; ctx.fillStyle='rgba(207,212,221,.55)';
    ctx.fillText(fmtUsd(c.bull+c.bear)+' engaged',cx,yH-2);
  }
  ctx.globalAlpha=1;
}

function render(t){
  requestAnimationFrame(render);
  if(!candles.length){drawBackground(t);return;}
  // camera glide
  if(cam.follow) cam.ti=candles.length-1 - (W*0.32)/cam.ppc*(cam.ppc<20?1:0);
  cam.i=lerp(cam.i,cam.ti,.12);
  cam.ppc=lerp(cam.ppc,cam.tppc,.12);
  fitY(); yLo=lerp(yLo,tyLo,.08); yHi=lerp(yHi,tyHi,.08);
  ctx.save();
  if(shake>0.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86;}
  drawBackground(t);
  const half=W/(2*cam.ppc)+2;
  const i0=Math.max(0,Math.floor(cam.i-half)), i1=Math.min(candles.length-1,Math.ceil(cam.i+half));
  updateTide(i0,i1);
  const battle=cam.ppc>=80, skirmish=cam.ppc>=26&&!battle, lineMode=cam.ppc<3.2;

  if(lineMode){ // zoomed way out: the war becomes the chart
    ctx.beginPath();
    for(let i=i0;i<=i1;i++){const c=candles[i];i===i0?ctx.moveTo(xOf(i),yOf(c.c)):ctx.lineTo(xOf(i),yOf(c.c));}
    ctx.strokeStyle=GOLD;ctx.lineWidth=1.6;ctx.shadowColor=GOLD;ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
    ctx.lineTo(xOf(i1),H);ctx.lineTo(xOf(i0),H);ctx.closePath();
    const ar=ctx.createLinearGradient(0,0,0,H);
    ar.addColorStop(0,'rgba(232,182,76,.16)');ar.addColorStop(1,'rgba(232,182,76,0)');
    ctx.fillStyle=ar;ctx.fill();
  } else {
    for(let i=i0;i<=i1;i++){
      const c=candles[i], cx=xOf(i), up=c.c>=c.o;
      const col=up?GOLD:CRIM;
      if(battle){ drawArmies(c,i,t,cx,1); continue; }
      // candlestick
      const bw=Math.max(cam.ppc*0.62,1.5);
      const yO=yOf(c.o),yC=yOf(c.c),yH2=yOf(c.h),yL2=yOf(c.l);
      ctx.strokeStyle=col;ctx.globalAlpha=.85;ctx.lineWidth=Math.max(cam.ppc*.08,1);
      ctx.beginPath();ctx.moveTo(cx,yH2);ctx.lineTo(cx,yL2);ctx.stroke();
      ctx.globalAlpha=1;
      const bt=Math.min(yO,yC), bh=Math.max(Math.abs(yC-yO),1.6);
      if(cam.ppc>10){ctx.shadowColor=col;ctx.shadowBlur=c.live?14:7;}
      ctx.fillStyle=up?'rgba(232,182,76,.92)':'rgba(224,54,79,.92)';
      ctx.fillRect(cx-bw/2,bt,bw,bh);
      ctx.shadowBlur=0;
      if(skirmish){ // pieces bleed through the candle — teaser of the battle inside
        const both=[...c.armyR.slice(-4).map(u=>({u,b:false})),...c.armyB.slice(-4).map(u=>({u,b:true}))];
        const fp=clamp(cam.ppc*.18,9,15);
        for(let k=0;k<both.length;k++){
          const {u,b}=both[k];
          const jx=cx+(u.fx-.5)*bw*1.4, jy=bt+((k+.5)/both.length)*bh+Math.sin(t*.002*u.sp+u.ph)*2.5;
          drawPiece(jx,jy,u.r,b,fp,.75,false,false);
        }
      }
      if(c.live&&cam.ppc>5){ // pulse marker on the live front
        const pu=(Math.sin(t*.005)+1)/2;
        ctx.globalAlpha=.5+pu*.5;ctx.fillStyle='#fff';
        ctx.beginPath();ctx.arc(cx,yC,2.2+pu*1.5,0,6.29);ctx.fill();ctx.globalAlpha=1;
      }
    }
    // live price line
    const lc=candles[candles.length-1];
    const ly=yOf(lc.c);
    ctx.strokeStyle=priceDir>=0?'rgba(232,182,76,.35)':'rgba(224,54,79,.35)';
    ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();ctx.setLineDash([]);
  }

  // sparks
  for(let k=sparks.length-1;k>=0;k--){const s=sparks[k];
    s.x+=s.vx;s.y+=s.vy;s.vy+=.05;s.l-=.03;
    if(s.l<=0){sparks.splice(k,1);continue;}
    ctx.globalAlpha=s.l;ctx.fillStyle=s.g?GOLD_HOT:CRIM_HOT;
    ctx.fillRect(s.x,s.y,1.8,1.8);
  }
  ctx.globalAlpha=1;

  // shockwaves & floating strikes (big trades visible at ANY zoom)
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];
    const age=(t-f.t)/1000; if(age>2.6){floats.splice(k,1);continue;}
    const fx=xOf(f.ci), fy=yOf(f.p);
    if(fx<-80||fx>W+80)continue;
    const col=f.bull?GOLD:CRIM, hot=f.bull?GOLD_HOT:CRIM_HOT;
    if(f.big){ // expanding ring
      ctx.globalAlpha=Math.max(0,1-age/1.4);ctx.strokeStyle=col;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(fx,fy,age*130,0,6.29);ctx.stroke();
      ctx.globalAlpha=Math.max(0,.5-age/2);ctx.beginPath();ctx.arc(fx,fy,age*220,0,6.29);ctx.stroke();
    }
    const rise=age*34;
    ctx.globalAlpha=Math.max(0,1-age/2.2);
    ctx.shadowColor=col;ctx.shadowBlur=16;
    ctx.font=(f.big?30:22)+'px "Noto Sans Symbols2","Segoe UI Symbol",serif';
    ctx.textAlign='center';ctx.fillStyle=hot;
    ctx.fillText(f.g,fx,fy-rise);
    ctx.shadowBlur=0;
    ctx.font='700 12px IBM Plex Mono';
    ctx.fillText(f.txt,fx,fy-rise+20);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ============ BOOT ============ */
(async function(){
  setConn('dead','LOADING HISTORY');
  const src=await loadKlines();
  if(candles.length){
    lastPrice=candles[candles.length-1].c;
    cam.i=cam.ti=candles.length-1-(W*0.32)/cam.ppc;
    fitY(); yLo=tyLo; yHi=tyHi;
    updateHUD();
  }
  if(!src){ // no REST at all → seed sim history
    let p=65000;
    for(let i=0;i<300;i++){const o=p;p+=(Math.random()-.5)*120;
      const c={t:Date.now()-(300-i)*60000,o,h:Math.max(o,p)+Math.random()*40,l:Math.min(o,p)-Math.random()*40,c:p,
        bull:3e5+Math.random()*4e6,bear:3e5+Math.random()*4e6,live:false};
      finalizeCandle(c);candles.push(c);}
    cam.i=cam.ti=candles.length-1-(W*0.32)/cam.ppc; fitY(); yLo=tyLo; yHi=tyHi;
    startSim();
  } else connectWS();
  requestAnimationFrame(render);
})();
</script>
