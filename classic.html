<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAWN WARS · BTC — every trade is a battle</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#06070b; --panel:rgba(10,12,18,.78);
    --gold:#e8b64c; --gold-hot:#ffd97a; --crimson:#e0364f; --crimson-hot:#ff6b7d;
    --bone:#cfd4dd; --dim:#6a7280; --line:rgba(232,182,76,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ink)}
  body{font-family:'IBM Plex Mono',monospace;color:var(--bone);-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(0,0,0,.55) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0;transition:opacity .08s}
  #dark{position:fixed;inset:0;pointer-events:none;z-index:6;background:#000;opacity:0;transition:opacity .5s}

  .hud{position:fixed;z-index:10;pointer-events:none}
  #topbar{top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:14px 20px;
    background:linear-gradient(to bottom, rgba(6,7,11,.92), rgba(6,7,11,0))}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-family:'Cinzel',serif;font-weight:900;font-size:22px;letter-spacing:.14em;color:var(--gold);
    text-shadow:0 0 24px rgba(232,182,76,.45)}
  .brand h1 .vs{color:var(--crimson);text-shadow:0 0 24px rgba(224,54,79,.5)}
  .brand .sub{font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
  #price{font-size:26px;font-weight:700;color:#fff;letter-spacing:.02em;min-width:180px;text-align:right;transition:color .15s}
  #price.up{color:var(--gold-hot)} #price.down{color:var(--crimson-hot)}
  #delta{font-size:12px;padding:3px 9px;border-radius:3px;font-weight:600}
  #delta.up{color:#0a0a0a;background:var(--gold)} #delta.down{color:#fff;background:var(--crimson)}
  #conn{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.2em;color:var(--dim)}
  #conn .dot{width:8px;height:8px;border-radius:50%;background:#3fbf6f;box-shadow:0 0 10px #3fbf6f;animation:pulse 1.6s infinite}
  #conn.sim .dot{background:#c9a227;box-shadow:0 0 10px #c9a227}
  #conn.dead .dot{background:#555;box-shadow:none;animation:none}
  @keyframes pulse{50%{opacity:.35}}

  #tide{position:fixed;top:58px;left:50%;transform:translateX(-50%);width:min(520px,70vw);z-index:10;pointer-events:none}
  #tide .lbl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.25em;color:var(--dim);margin-bottom:4px}
  #tide .lbl b:first-child{color:var(--gold)} #tide .lbl b:last-child{color:var(--crimson)}
  #tidebar{height:5px;border-radius:3px;overflow:hidden;background:var(--crimson);box-shadow:0 0 14px rgba(224,54,79,.35)}
  #tidefill{height:100%;width:50%;background:linear-gradient(90deg,var(--gold),var(--gold-hot));
    box-shadow:0 0 14px rgba(232,182,76,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}

  #killfeed{left:16px;top:120px;width:300px;display:flex;flex-direction:column;gap:6px}
  #killfeed .k{background:var(--panel);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 4px 4px 0;
    font-size:11px;line-height:1.45;backdrop-filter:blur(6px);animation:kin .35s cubic-bezier(.2,.9,.3,1.2)}
  #killfeed .k.bear{border-left-color:var(--crimson)}
  #killfeed .k.royal{border-left-width:6px;box-shadow:0 0 18px rgba(232,182,76,.25)}
  #killfeed .k.royal.bear{box-shadow:0 0 18px rgba(224,54,79,.3)}
  #killfeed .k .rank{font-family:'Cinzel',serif;font-weight:700;font-size:11px;letter-spacing:.12em}
  #killfeed .k.royal .rank{font-size:13px}
  #killfeed .k.bull .rank{color:var(--gold-hot)} #killfeed .k.bear .rank{color:var(--crimson-hot)}
  #killfeed .k .amt{color:#fff;font-weight:600} #killfeed .k .at{color:var(--dim)}
  @keyframes kin{from{opacity:0;transform:translateX(-18px)}}

  #legend{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:16px;align-items:center;
    background:var(--panel);padding:8px 18px;border-radius:6px;border:1px solid var(--line);backdrop-filter:blur(6px)}
  #legend .p{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);white-space:nowrap}
  #legend .p .g{font-size:15px;color:var(--bone)}
  #legend .sep{width:1px;height:18px;background:var(--line)}

  #hint{bottom:64px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.22em;color:var(--dim);
    text-transform:uppercase;text-align:center;transition:opacity 1s}
  #hint.gone{opacity:0}

  #snapback{position:fixed;right:18px;bottom:18px;z-index:20;font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.15em;font-size:11px;color:#0a0a0a;background:var(--gold);border:none;padding:9px 16px;
    border-radius:4px;cursor:pointer;display:none;box-shadow:0 0 20px rgba(232,182,76,.5)}
  #snapback:hover{background:var(--gold-hot)}
  #battlebtn{position:fixed;right:18px;top:70px;z-index:20;font-family:'Cinzel',serif;font-weight:700;
    letter-spacing:.12em;font-size:11px;color:var(--gold);background:var(--panel);border:1px solid var(--line);
    padding:9px 14px;border-radius:4px;cursor:pointer;backdrop-filter:blur(6px)}
  #battlebtn:hover{color:var(--gold-hot);border-color:var(--gold)}

  #cine{position:fixed;top:34%;left:0;right:0;z-index:15;text-align:center;pointer-events:none;opacity:0}
  #cine.on{animation:cine 3.4s ease forwards}
  #cine h2{font-family:'Cinzel',serif;font-weight:900;font-size:clamp(26px,4.6vw,54px);letter-spacing:.18em;color:#fff;
    text-shadow:0 0 40px currentColor}
  #cine.gold h2{color:var(--gold-hot)} #cine.crim h2{color:var(--crimson-hot)}
  #cine p{font-size:13px;letter-spacing:.4em;color:var(--bone);margin-top:10px;text-transform:uppercase}
  @keyframes cine{0%{opacity:0;transform:scale(1.15);filter:blur(6px)}12%{opacity:1;transform:scale(1);filter:blur(0)}
    80%{opacity:1}100%{opacity:0;transform:scale(.97)}}
  @media (max-width:760px){ #killfeed{display:none} .brand .sub{display:none} #tide{top:66px} #legend{display:none} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="vig"></div><div id="flash"></div><div id="dark"></div>

<div class="hud" id="topbar">
  <div class="brand"><h1>PAWN <span class="vs">WARS</span></h1>
    <span class="sub">BTC / USDT · every trade is a battle</span></div>
  <div id="price">—</div><div id="delta" class="up">·</div>
  <div id="conn" class="dead"><span class="dot"></span><span id="connlbl">CONNECTING</span></div>
</div>

<div id="tide"><div class="lbl"><b>⚔ BULL LEGION</b><b>BEAR HORDE ⚔</b></div>
  <div id="tidebar"><div id="tidefill"></div></div></div>

<div class="hud" id="killfeed"></div>

<div class="hud" id="legend">
  <div class="p"><span class="g">♟</span>PAWN &lt;$10K</div>
  <div class="p"><span class="g">♞</span>KNIGHT $10K</div>
  <div class="p"><span class="g">♝</span>BISHOP $50K</div>
  <div class="sep"></div>
  <div class="p"><span class="g">♜</span>ROOK $250K · volley</div>
  <div class="p"><span class="g">♛</span>QUEEN $1M · bladestorm</div>
  <div class="p"><span class="g">♚</span>KING $5M+ · cataclysm</div>
</div>
<div class="hud" id="hint">scroll to zoom · drag to pan · click a candle to enter the battle</div>
<button id="snapback">⏵ RETURN TO FRONT</button>
<button id="battlebtn">⚔ ENTER BATTLE</button>
<a href="index.html" style="position:fixed;right:18px;top:112px;z-index:20;font-size:10px;letter-spacing:.12em;color:#6a7280;background:rgba(10,12,18,.78);border:1px solid rgba(255,255,255,.08);padding:7px 12px;border-radius:4px;cursor:pointer;text-decoration:none;font-family:'IBM Plex Mono',monospace">⬢ 3D WAR MAP</a>
<div id="cine"><h2></h2><p></p></div>

<script>
'use strict';
/* ================= CONFIG ================= */
const RANKS=[
  {name:'PAWN',g:'♟︎',min:0,sc:.9},{name:'KNIGHT',g:'♞︎',min:1e4,sc:1.25},
  {name:'BISHOP',g:'♝︎',min:5e4,sc:1.1},{name:'ROOK',g:'♜︎',min:2.5e5,sc:1.3},
  {name:'QUEEN',g:'♛︎',min:1e6,sc:1.5},{name:'KING',g:'♚︎',min:5e6,sc:2.1}];
const rankOf=u=>{let r=0;for(let i=0;i<RANKS.length;i++)if(u>=RANKS[i].min)r=i;return r};
const GOLD='#e8b64c',GOLD_HOT='#ffd97a',GOLD_DK='#8a651f',CRIM='#e0364f',CRIM_HOT='#ff6b7d',CRIM_DK='#7a1826';
const STEEL='#3a4050',STEEL_DK='#1c2029';
const KILL_MIN=1e5, MAX_CANDLES=520;
const BAT0=46, BAT1=110;                   // battle fade-in zoom range

/* ================= STATE ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const candles=[];
const cam={i:0,ppc:7,ti:0,tppc:7,follow:true};
let yLo=0,yHi=1,tyLo=0,tyHi=1,shake=0,lastPrice=0,priceDir=0,mode='dead';
let battleAmt=0, groundY=0;
/* FX pools */
const FX={arrows:[],shots:[],pillars:[],slashes:[],booms:[],debris:[],smoke:[],
          craters:[],fires:[],corpses:[],sparks:[],floats:[],bolts:[]};
let lightningT=0, nextBoltAt=8000;

/* ================= UTILS ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmtUsd=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(0)+'K':'$'+v.toFixed(0);
const fmtP=p=>p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:0}):p.toFixed(2);
const cap=(arr,n)=>{if(arr.length>n)arr.splice(0,arr.length-n)};

/* ================= ARMY SYNTH ================= */
function synthArmy(usd,seed){
  const rnd=mulberry32(seed),army=[];
  const caps=[1,2,3,5,9,16],vals=[5e6,1e6,2.5e5,5e4,1e4,1500];
  let rem=usd;
  for(let i=0;i<vals.length;i++){
    const ri=5-i;
    let n=Math.min(caps[i],Math.floor(rem/vals[i]*(0.6+rnd()*0.5)));
    if(ri>=4&&rnd()<0.5)n=Math.min(n,1);
    for(let k=0;k<n;k++)army.push({r:ri,ph:rnd()*6.28,fx:rnd(),sp:.7+rnd()*.8,bow:ri===0&&rnd()<.45});
    rem-=n*vals[i];
  }
  if(!army.length)army.push({r:0,ph:rnd()*6.28,fx:rnd(),sp:1,bow:false});
  army.sort((a,b)=>a.r-b.r);
  return army.slice(0,34);
}
function finalizeCandle(c){
  c.armyB=synthArmy(c.bull,(c.t/60000)|0);
  c.armyR=synthArmy(c.bear,((c.t/60000)|0)^0x9e37);
  c.uv=null;
}

/* ================= DATA FEEDS ================= */
function setConn(m,lbl){mode=m;
  const el=document.getElementById('conn');
  el.className=m==='live'?'':(m==='sim'?'sim':'dead');
  document.getElementById('connlbl').textContent=lbl;}
async function loadKlines(){
  for(const base of ['https://data-api.binance.vision','https://api.binance.com']){
    try{
      const r=await fetch(base+'/api/v3/klines?symbol=BTCUSDT&interval=1m&limit='+MAX_CANDLES,{signal:AbortSignal.timeout(7000)});
      if(!r.ok)throw 0;
      for(const k of await r.json()){
        const q=+k[7],bq=+k[10];
        const c={t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],bull:bq,bear:Math.max(q-bq,0),live:false};
        finalizeCandle(c);candles.push(c);
      }
      return 'binance';
    }catch(e){}
  }
  try{
    const r=await fetch('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60',{signal:AbortSignal.timeout(7000)});
    if(!r.ok)throw 0;
    for(const k of (await r.json()).reverse()){
      const [t,l,h,o,c,v]=k,q=v*c,up=c>=o,rnd=mulberry32(t|0)();
      const share=up?.53+rnd*.12:.35+rnd*.12;
      const cd={t:t*1000,o,h,l,c,bull:q*share,bear:q*(1-share),live:false};
      finalizeCandle(cd);candles.push(cd);
    }
    return 'coinbase';
  }catch(e){}
  return null;
}
function onTrade(price,usd,isBull,ts){
  lastPrice&&(priceDir=price>lastPrice?1:price<lastPrice?-1:priceDir);lastPrice=price;
  let c=candles[candles.length-1];
  const bucket=Math.floor(ts/60000)*60000;
  if(!c||bucket>c.t){
    c={t:bucket,o:price,h:price,l:price,c:price,bull:0,bear:0,live:true,armyB:[],armyR:[],uv:null};
    candles.push(c);
    if(candles.length>MAX_CANDLES){candles.shift();cam.ti--;cam.i--;shiftFX();}
    const prev=candles[candles.length-2];
    if(prev){prev.live=false;finalizeCandle(prev);}
  }
  c.h=Math.max(c.h,price);c.l=Math.min(c.l,price);c.c=price;
  if(isBull)c.bull+=usd;else c.bear+=usd;
  const r=rankOf(usd);
  if(r>=1){const arm=isBull?c.armyB:c.armyR,rnd=Math.random;
    arm.push({r,ph:rnd()*6.28,fx:rnd(),sp:.7+rnd()*.8,bow:false,born:performance.now()});
    arm.sort((a,b)=>a.r-b.r);if(arm.length>34)arm.splice(0,arm.length-34);c.uv=null;}
  const ci=candles.length-1;
  if(r===2)      spawnBolt(ci,price,isBull,usd);
  else if(r===3) spawnVolley(ci,price,isBull,usd);
  else if(r===4) spawnSlash(ci,price,isBull,usd);
  else if(r===5) spawnCataclysm(ci,price,isBull,usd);
  if(r>=3) FX.floats.push({ci,p:price,g:RANKS[r].g,txt:fmtUsd(usd),bull:isBull,t:performance.now(),big:r>=4});
  if(usd>=KILL_MIN)killfeed(r,usd,price,isBull);
  updateHUD();
}
function shiftFX(){for(const k of ['shots','pillars','slashes','craters','fires','corpses','floats','bolts'])
  for(const f of FX[k]) f.ci--; }
function connectWS(){
  const hosts=['wss://data-stream.binance.vision/ws/btcusdt@aggTrade','wss://stream.binance.com:9443/ws/btcusdt@aggTrade'];
  let hi=0,cbTried=false;
  function tryBinance(){
    if(hi>=hosts.length)return tryCoinbase();
    const ws=new WebSocket(hosts[hi++]);let ok=false;
    const bail=setTimeout(()=>{if(!ok){try{ws.close()}catch(e){}}},6000);
    ws.onmessage=ev=>{ok=true;clearTimeout(bail);setConn('live','LIVE · BINANCE');
      const d=JSON.parse(ev.data),p=+d.p,q=+d.q;onTrade(p,p*q,!d.m,d.T);};
    ws.onclose=()=>{clearTimeout(bail);if(ok){setConn('dead','RECONNECTING');setTimeout(connectWS,2000);}else tryBinance();};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  function tryCoinbase(){
    if(cbTried)return startSim();cbTried=true;
    const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');let ok=false;
    const bail=setTimeout(()=>{if(!ok){try{ws.close()}catch(e){}}},7000);
    ws.onopen=()=>ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD'],channels:['matches']}));
    ws.onmessage=ev=>{const d=JSON.parse(ev.data);
      if(d.type!=='match'&&d.type!=='last_match')return;
      ok=true;clearTimeout(bail);setConn('live','LIVE · COINBASE');
      onTrade(+d.price,+d.price*+d.size,d.side==='sell',Date.parse(d.time));};
    ws.onclose=()=>{clearTimeout(bail);if(ok){setConn('dead','RECONNECTING');setTimeout(connectWS,2000);}else startSim();};
    ws.onerror=()=>{try{ws.close()}catch(e){}};
  }
  tryBinance();
}
let simOn=false;
function startSim(){
  if(simOn)return;simOn=true;setConn('sim','SIMULATION');
  let p=lastPrice||candles[candles.length-1]?.c||65000,drift=0;
  setInterval(()=>{
    drift=drift*.94+(Math.random()-.5)*14;
    p=Math.max(1000,p+drift+(Math.random()-.5)*20);
    const big=Math.random(),usd=big>.9965?(2e6+Math.random()*9e6):big>.96?(2e5+Math.random()*9e5):(800+Math.random()**2*6e4);
    onTrade(p,usd,Math.random()<.5+drift*.004,Date.now());
  },140);
}

/* ================= HUD / KILLFEED / CINEMATIC ================= */
const kfEl=document.getElementById('killfeed');
function killfeed(r,usd,price,isBull){
  const d=document.createElement('div');
  d.className='k '+(isBull?'bull':'bear')+(r>=4?' royal':'');
  const act=r>=5?'CATACLYSM':r>=4?'BLADESTORM':r>=3?'SIEGE VOLLEY':'strike';
  d.innerHTML=`<span class="rank">${RANKS[r].g} ${isBull?'BULL':'BEAR'} ${RANKS[r].name}</span><br>
    <span class="amt">${fmtUsd(usd)}</span> <span class="at">${act} @ ${fmtP(price)}</span>`;
  kfEl.prepend(d);
  while(kfEl.children.length>7)kfEl.lastChild.remove();
  setTimeout(()=>{d.style.transition='opacity 1s';d.style.opacity='0';setTimeout(()=>d.remove(),1000)},14000);
}
const priceEl=document.getElementById('price'),deltaEl=document.getElementById('delta'),tideEl=document.getElementById('tidefill');
let hudTick=0;
function updateHUD(){
  if(performance.now()-hudTick<150)return;hudTick=performance.now();
  const c=candles[candles.length-1];if(!c)return;
  priceEl.textContent=fmtP(c.c);
  priceEl.className=priceDir>0?'up':priceDir<0?'down':'';
  const ref=candles[Math.max(0,candles.length-61)];
  const pct=(c.c/ref.o-1)*100;
  deltaEl.textContent=(pct>=0?'▲ +':'▼ ')+pct.toFixed(2)+'% / 1H';
  deltaEl.className=pct>=0?'up':'down';
}
function updateTide(i0,i1){
  let b=0,s=0;
  for(let i=Math.max(0,i0);i<=Math.min(candles.length-1,i1);i++){b+=candles[i].bull;s+=candles[i].bear;}
  if(b+s>0)tideEl.style.width=(b/(b+s)*100).toFixed(1)+'%';
}
const cineEl=document.getElementById('cine'),flashEl=document.getElementById('flash'),darkEl=document.getElementById('dark');
function cinematic(title,sub,bull){
  cineEl.className=bull?'gold':'crim';
  cineEl.querySelector('h2').textContent=title;
  cineEl.querySelector('p').textContent=sub;
  void cineEl.offsetWidth; cineEl.classList.add('on');
  setTimeout(()=>cineEl.classList.remove('on'),3500);
  darkEl.style.opacity=.45;setTimeout(()=>darkEl.style.opacity=0,2600);
}
function screenFlash(a){flashEl.style.opacity=a;setTimeout(()=>flashEl.style.opacity=0,70);}

/* ================= ATTACKS ================= */
function spawnBolt(ci,p,bull,usd){
  FX.bolts.push({ci,p,bull,t0:performance.now(),usd});cap(FX.bolts,20);
}
function spawnVolley(ci,p,bull,usd){
  const n=2+Math.min(3,Math.floor(usd/3e5));
  for(let k=0;k<n;k++)
    FX.shots.push({kind:'boulder',ci,p,bull,t0:performance.now()+k*160,dur:1100,fx:Math.random()});
  cap(FX.shots,40);
}
function spawnSlash(ci,p,bull,usd){
  FX.slashes.push({ci,p,bull,t0:performance.now(),usd});cap(FX.slashes,8);
  shake=Math.min(shake+7,12);screenFlash(.22);
  addCasualties(ci,!bull,4+Math.floor(usd/5e5));
}
function spawnCataclysm(ci,p,bull,usd){
  cinematic(bull?'⚑ A KING RISES':'☄ A KING FALLS UPON US',
    fmtUsd(usd)+(bull?' BUY — THE EARTH ERUPTS':' SELL — METEORS INBOUND'),bull);
  const n=4+Math.min(4,Math.floor(usd/4e6));
  for(let k=0;k<n;k++){
    if(bull) FX.pillars.push({ci,p,t0:performance.now()+600+k*220,fx:.15+Math.random()*.7});

const xOf=i=>(i-cam.i)*cam.ppc+W/2;
const iAt=x=>(x-W/2)/cam.ppc+cam.i;
let chartB=0;
function yOf(p){const top=lerp(H*0.15,H*0.10,battleAmt);
  return chartB-((p-yLo)/(yHi-yLo))*(chartB-top);}
function fitY(){
  const half=W/(2*cam.ppc);
  let lo=Infinity,hi=-Infinity;
  for(let i=Math.max(0,Math.floor(cam.i-half));i<=Math.min(candles.length-1,Math.ceil(cam.i+half));i++){
    const c=candles[i];if(c.l<lo)lo=c.l;if(c.h>hi)hi=c.h;}
  if(lo===Infinity)return;
  const pad=(hi-lo)*0.10+1;tyLo=lo-pad;tyHi=hi+pad;
}

function drawSky(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04050b');g.addColorStop(.45,'#0b0d1a');
  g.addColorStop(.72,'#1c141c');g.addColorStop(1,'#241418');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=s.a*(.4+.6*Math.abs(Math.sin(t*.0006+s.x*20)));
    ctx.fillStyle='#9aa4c8';ctx.fillRect(s.x*W,s.y*H,1.1,1.1);}
  ctx.globalAlpha=1;
  // storm banks
  for(const c of clouds){
    c.x+=c.v/60;if(c.x>1.2)c.x=-.2;if(c.x<-.2)c.x=1.2;
    const cx=c.x*W,cy=c.y*H,r=90*c.s+30*Math.sin(t*.0003+c.x*9);
    const cg=ctx.createRadialGradient(cx,cy,r*.1,cx,cy,r*1.5);
    const tint=c.red?'rgba(90,25,38,':'rgba(24,30,58,';
    cg.addColorStop(0,tint+'.42)');cg.addColorStop(1,tint+'0)');
    ctx.fillStyle=cg;ctx.fillRect(cx-r*1.6,cy-r*1.2,r*3.2,r*2.4);
  }
  // heat lightning
  if(t>nextBoltAt){lightningT=t;nextBoltAt=t+7000+Math.random()*12000;}
  const la=1-(t-lightningT)/300;
  if(la>0){ctx.fillStyle='rgba(190,200,255,'+(la*.10)+')';ctx.fillRect(0,0,W,H*.6);
    if(la>.6){ctx.strokeStyle='rgba(210,220,255,'+la*.7+')';ctx.lineWidth=1.6;
      const rnd=mulberry32(lightningT|0);let lx=rnd()*W,ly=0;ctx.beginPath();ctx.moveTo(lx,ly);
      while(ly<H*.42){lx+=(rnd()-.5)*70;ly+=18+rnd()*26;ctx.lineTo(lx,ly);}
      ctx.stroke();}}
  // embers
  for(const e of embers){
    e.y-=e.v/60;if(e.y<0){e.y=1;e.x=Math.random();}
    const ex=e.x*W+Math.sin(t*.0004+e.x*40)*30,ey=e.y*H;
    ctx.fillStyle=e.g?'rgba(232,182,76,.3)':'rgba(224,54,79,.24)';
    ctx.fillRect(ex,ey,e.s,e.s);}
}
function drawFarRidge(){ // distant war: whole history as a mountain silhouette
  if(candles.length<10)return;
  const n=candles.length,y0=H*.34,amp=H*.13;
  let lo=Infinity,hi=-Infinity;
  for(const c of candles){if(c.c<lo)lo=c.c;if(c.c>hi)hi=c.c;}
  if(hi<=lo)return;
  ctx.beginPath();
  for(let k=0;k<=60;k++){
    const i=Math.floor(k/60*(n-1)),c=candles[i];
    const x=k/60*W,y=y0-((c.c-lo)/(hi-lo))*amp;
    k===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle='rgba(7,8,14,.85)';ctx.fill();
  ctx.strokeStyle='rgba(232,182,76,.14)';ctx.lineWidth=1;ctx.stroke();
}

  ctx.restore();

    const age=(t-f.t0)/1000;if(age>f.life||f.ci<0){FX.fires.splice(k,1);continue;}

    ctx.beginPath();ctx.moveTo(x-r*.5,y);ctx.quadraticCurveTo(x-r*.55,y-r*1.1,x,y-r*(1.5+.5*fl));
    ctx.quadraticCurveTo(x+r*.55,y-r*1.1,x+r*.5,y);ctx.closePath();ctx.fill();
    if(Math.random()<.12)FX.smoke.push({x:x+(Math.random()-.5)*6,y:y-r,r:3+Math.random()*3,l:1,vr:.2});

const DRAW=[drawSoldier,drawKnightU,drawBishopU,drawRookU,drawQueenU,drawKingU];

function buildUnits(c,i,budget){
  const units=[],mk=(arr,bull)=>{
    const take=Math.min(arr.length,budget);
    for(let k=0;k<take;k++){const u=arr[k];
      units.push({...u,bull,row:u.r>=3?2:(k%2),fi:k/Math.max(take-1,1)});}
  };
  mk(c.armyB,true);mk(c.armyR,false);
  return {budget,units};
}
function drawSector(c,i,t,alpha){
  const cx=xOf(i);
  const budget=clamp(Math.round((cam.ppc-30)/7),3,22);
  if(!c.uv||c.uv.budget!==budget)c.uv=buildUnits(c,i,budget);
  const gy=groundY,gh=H-gy;
  const closePos=(c.c-c.l)/Math.max(c.h-c.l,1e-9);
  const frontX=cx+(closePos-.5)*cam.ppc*.5;
  const sBase=clamp(cam.ppc*.11,11,34);
  const up=c.c>=c.o;
  // light shaft from candle to its battlefield
  const bw=Math.max(cam.ppc*.6,2),yB=Math.min(yOf(c.o),yOf(c.c))+Math.abs(yOf(c.c)-yOf(c.o));
  ctx.globalAlpha=alpha*.10;
  const sh=ctx.createLinearGradient(0,yB,0,gy+gh*.5);
  sh.addColorStop(0,up?GOLD:CRIM);sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sh;
  ctx.beginPath();ctx.moveTo(cx-bw/2,yB);ctx.lineTo(cx+bw/2,yB);
  ctx.lineTo(cx+cam.ppc*.42,gy+gh*.6);ctx.lineTo(cx-cam.ppc*.42,gy+gh*.6);ctx.closePath();ctx.fill();
  ctx.globalAlpha=alpha;
  // sector banner pole
  if(cam.ppc>70){
    const bx=cx-cam.ppc*.48;
    limb(bx,gy+gh*.15,bx,gy-gh*.22,1.5,'rgba(120,110,100,.5)');
    ctx.fillStyle=up?GOLD:CRIM;ctx.globalAlpha=alpha*.8;
    ctx.beginPath();ctx.moveTo(bx,gy-gh*.22);ctx.lineTo(bx+12,gy-gh*.19);ctx.lineTo(bx,gy-gh*.16);ctx.closePath();ctx.fill();
    ctx.globalAlpha=alpha;
  }
  // units — rear rows first
  const rows=[[],[],[]];
  for(const u of c.uv.units)rows[u.row].push(u);
  for(let r=2;r>=0;r--){
    for(const u of rows[r]){
      const persp=1+ (2-r)*0.16;
      const s=sBase*RANKS[u.r].sc*persp;
      const span=cam.ppc*.42;
      const x0=u.bull?cx-span:frontX+span*.08,x1=u.bull?frontX-span*.08:cx+span;
      let ux=lerp(u.bull?x0:x1,u.bull?x1:x0,u.fi*.85+.05)+(u.fx-.5)*sBase;
      const uy=gy+gh*(0.22+r*0.2)+ (u.fx-.5)*gh*.05;

      ctx.globalAlpha=alpha;
      if(fighting&&u.r<=1&&Math.random()<.09&&FX.sparks.length<300)
        FX.sparks.push({x:frontX+(Math.random()-.5)*6,y:uy-s*.5,vx:(Math.random()-.5)*2,vy:-Math.random()*2,l:1,g:Math.random()<.5});
      // archers loose arrows
      if(u.bow&&Math.random()<.010&&FX.arrows.length<70){
        const tx=frontX+(u.bull?1:-1)*(20+Math.random()*cam.ppc*.3);
        FX.arrows.push({x:ux,y:uy-s*.6,tx,ty:uy+(Math.random()-.5)*14,p:0,v:.02+Math.random()*.012,bull:u.bull});}
    }
  }

  cg.addColorStop(0,'rgba(255,230,180,.5)');cg.addColorStop(1,'rgba(255,230,180,0)');
  ctx.fillStyle=cg;ctx.fillRect(frontX-sBase*3,gy,sBase*6,gh);
  ctx.globalAlpha=alpha;
  // labels
  if(cam.ppc>95){
    ctx.textAlign='center';
    ctx.font='700 '+clamp(cam.ppc*.05,10,15)+'px Cinzel';
    ctx.fillStyle=up?GOLD:CRIM;ctx.globalAlpha=alpha*.9;
    ctx.fillText(up?'⚑ BULLS ADVANCE':'⚑ BEARS ADVANCE',cx,gy-8);
    ctx.font='10px IBM Plex Mono';ctx.fillStyle='rgba(207,212,221,.5)';
    ctx.fillText(fmtUsd(c.bull+c.bear)+' ENGAGED',cx,gy+12);
    ctx.globalAlpha=alpha;
  }
  // corpses in this sector
  for(const cp of FX.corpses){
    if(cp.ci!==i||t<cp.t0)continue;
    const age=(t-cp.t0)/1000;if(age>22)continue;
    const x=cx+(cp.fx-.5)*cam.ppc*.8,y=gy+gh*(.3+cp.fx*.35);
    ctx.save();ctx.globalAlpha=alpha*clamp(1-age/22,0,1)*.55;
    ctx.translate(x,y);ctx.rotate(cp.bull?1.45:-1.45);
    limb(0,0,0,-sBase*.6,sBase*.14,'#15171d');
    ctx.fillStyle='#20232c';ctx.beginPath();ctx.arc(0,-sBase*.66,sBase*.09,0,6.29);ctx.fill();

}

/* ambient marchers along the ground at chart zoom */
const marchers=[];for(let i=0;i<26;i++)marchers.push({x:Math.random(),ph:Math.random()*6.28,sp:.5+Math.random(),g:Math.random()<.5});
function drawMarchers(t){

/* ================= MAIN LOOP ================= */
function render(t){
  requestAnimationFrame(render);
  if(!candles.length){drawSky(t);return;}
  if(cam.follow)cam.ti=candles.length-1-(W*0.32)/cam.ppc*(cam.ppc<20?1:0);
  cam.i=lerp(cam.i,cam.ti,.12);
  cam.ppc=lerp(cam.ppc,cam.tppc,.12);
  battleAmt=smooth(BAT0,BAT1,cam.ppc);
  groundY=H*lerp(0.88,0.56,battleAmt);
  chartB=lerp(H*0.86,groundY-H*0.05,battleAmt);
  fitY();yLo=lerp(yLo,tyLo,.08);yHi=lerp(yHi,tyHi,.08);
  ctx.save();
  if(shake>0.3){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.87;}
  drawSky(t);
  drawFarRidge();
  drawGround(t);
  const half=W/(2*cam.ppc)+2;
  const i0=Math.max(0,Math.floor(cam.i-half)),i1=Math.min(candles.length-1,Math.ceil(cam.i+half));
  updateTide(i0,i1);
  if(cam.ppc<3.2)drawLine(i0,i1);else drawCandles(t,i0,i1);
  if(battleAmt>0.02){
    for(let i=i0;i<=i1;i++)drawSector(candles[i],i,t,battleAmt);
  }
  drawMarchers(t);
  drawFX(t);
  ctx.restore();
}

    for(let i=0;i<300;i++){const o=p;p+=(Math.random()-.5)*120;
      const c={t:Date.now()-(300-i)*60000,o,h:Math.max(o,p)+Math.random()*40,l:Math.min(o,p)-Math.random()*40,c:p,
        bull:3e5+Math.random()*4e6,bear:3e5+Math.random()*4e6,live:false};
      finalizeCandle(c);candles.push(c);}
    cam.i=cam.ti=candles.length-1-(W*0.32)/cam.ppc;
    battleAmt=0;groundY=H*.88;chartB=H*.86;
    fitY();yLo=tyLo;yHi=tyHi;
    startSim();
  }else connectWS();
  requestAnimationFrame(render);
})();
</script>
